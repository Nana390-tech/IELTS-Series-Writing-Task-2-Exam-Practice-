<style>

<script>
const QS=[
{id:"q1",topic:"Education",
 q:"Some universities require students to attend every class, and those who miss lessons cannot sit the final exam. To what extent do you agree or disagree with this rule?",
 keywords:["attend","attendance","class","classes","lesson","lessons","university","students","exam"],
 plan:{pos:"Partly agree",
  i1:"Attendance protects weaker students, who learn most from live explanation and practice.",
  e1:"A student who misses grammar classes cannot catch up from slides alone.",
  i2:"A total ban from the exam is too harsh, because some absences are unavoidable.",
  e2:"A student in hospital for a week should be allowed to take the exam.",
  con:"Keep a minimum attendance rule, but allow exceptions for serious reasons."},
 paras:[
  {label:"Introduction",text:"Some people believe that students should be free to decide when to attend their classes, ((while)) others argue that lessons must be compulsory and that absent students should lose the right to sit the examination. [[In my opinion]], attendance rules are necessary, ((but)) this particular punishment is too severe. In this essay I will discuss both views and give the reasons for my position."},
  {label:"Body 1: the view that the rule is fair",text:"((Firstly)), regular attendance clearly improves learning. Most courses are built around explanation, discussion and practice, ((so)) a student who reads the slides at home receives only part of the lesson. ((For example)), in a writing class, learners get feedback on their own paragraphs, which no recording can replace. ((In addition)), weaker students benefit the most from being in the room, ((because)) they can ask questions immediately. ((Furthermore)), courses that include group work depend on students being present: if half the class is missing, the remaining learners are left without partners. [[For this reason, I believe]] universities are right to set a minimum level of attendance."},
  {label:"Body 2: my own view",text:"((On the other hand)), many students and parents argue that banning a learner from the examination is an extreme measure. Some absences are completely outside the student's control, ((such as)) illness, family emergencies or hospital appointments. ((As a result)), a hard-working learner could lose an entire semester for reasons that are not their fault. [[It could also be argued that]] the university already has fairer tools, ((for instance)) lower participation marks or compulsory extra tasks for missed lessons."},
  {label:"Conclusion",text:"((In conclusion)), [[while I agree that]] students should be required to attend most of their classes, [[I do not believe]] that missing a few lessons should prevent them from sitting the exam. ((Instead)), universities should set a clear attendance percentage and accept documented reasons for absence."}],
 why:[
  "The introduction gives both views, then the writer's own opinion, then what the essay will do.",
  "Body 1 explains the view the writer does not fully share; Body 2 gives the writer's own view.",
  "Every idea has a reason and an example, not just a claim.",
  "The conclusion repeats the position in new words and adds no new idea."]},
{id:"q2",topic:"Technology",
 q:"Some people believe that mobile phones should be banned in secondary schools. To what extent do you agree or disagree?",
 keywords:["mobile","phone","phones","school","schools","students","ban","banned","classroom"],
 plan:{pos:"Partly agree",
  i1:"Phones distract students and harm concentration during lessons.",
  e1:"Notifications interrupt a task every few minutes.",
  i2:"Phones are useful learning tools and a safety link to parents.",
  e2:"Students can look up words or contact family after school.",
  con:"Ban phones during lessons, not on school grounds."},
 paras:[
  {label:"Introduction",text:"Some people think that mobile phones have no place in secondary schools, ((while)) others believe that they are a useful part of modern learning. [[In my view]], phones should be switched off during lessons, ((but)) [[I do not believe]] that a complete ban on school grounds is necessary. This essay will consider both views before explaining my position."},
  {label:"Body 1: the view that phones should be banned",text:"((Firstly)), phones damage concentration. Teenagers receive messages and notifications every few minutes, ((so)) their attention is constantly interrupted. ((As a result)), they lose the thread of the lesson and their academic performance suffers. ((Moreover)), phones can be used to cheat in tests and to record classmates without permission, ((which leads to)) serious problems with privacy and bullying. ((For this reason)), most teachers support collecting phones at the start of a lesson. ((Furthermore)), schools that collect phones at the door often report calmer classrooms and better test results."},
  {label:"Body 2: the other view, and my position",text:"((On the other hand)), phones also have clear benefits. They are useful learning tools, ((for example)) for checking the meaning of new words, scanning a text with a camera or joining an online quiz. ((For instance)), a class can check an unfamiliar word in seconds, which would otherwise interrupt the whole lesson. ((In addition)), parents want to reach their children after school, ((particularly)) when transport is delayed. [[It could be argued that]] removing phones completely simply moves the problem: students who never learn to control their phone use at school will struggle at university."},
  {label:"Conclusion",text:"((In conclusion)), [[I strongly believe that]] phones should be switched off and put away during lessons, ((but)) [[I disagree with]] banning them from the school entirely. ((Overall)), clear rules and lessons about responsible use are more effective than a total ban."}],
 why:[
  "Both views are in the introduction: phones have no place at school, or phones are a useful tool.",
  "Body 1 gives the arguments for a ban; Body 2 gives the arguments against it and the writer's position.",
  "The position is precise (banned in lessons, not on school grounds) and it never changes.",
  "Topic collocations are used naturally: academic performance, learning tools, responsible use."]},
{id:"q3",topic:"Work and study",
 q:"Many people say that young adults should work for a few years before they start university. To what extent do you agree or disagree?",
 keywords:["work","working","university","students","young","adults","job","degree","study"],
 plan:{pos:"Agree",
  i1:"Work experience helps students choose the right subject.",
  e1:"Someone who works in a clinic learns whether nursing suits them.",
  i2:"Working first builds maturity, money management and confidence.",
  e2:"Paying for their own course makes students take it seriously.",
  con:"A gap of one or two years is valuable, as long as it is planned."},
 paras:[
  {label:"Introduction",text:"Some people argue that school leavers should begin their degree immediately, ((while)) others believe that a few years of employment first is far more valuable. [[In my opinion]], a short period of work benefits most young adults, ((because)) it helps them choose the right course and prepares them for the demands of study. This essay will discuss both views and explain my reasons."},
  {label:"Body 1: why work experience helps",text:"((Firstly)), many eighteen-year-olds choose a degree without knowing what the job involves. ((As a result)), a large number of students change subject or leave university altogether, ((which)) wastes both their time and public money. ((For example)), a young person who works as an assistant in a clinic quickly discovers whether they are suited to nursing. ((Therefore)), a short period of work can prevent an expensive mistake. ((Furthermore)), universities themselves benefit, ((since)) classes filled with motivated students are easier to teach."},
  {label:"Body 2: the opposite view, and my answer to it",text:"((On the other hand)), some people argue that young people should start their degree without delay. ((They point out that)) students who stop studying may lose the habit of academic work, and that a late start delays graduation and a professional salary. [[However, I am convinced that]] these disadvantages are small. A gap of one or two years is short, ((whereas)) employment teaches skills that school does not: young workers learn to manage their time, deal with difficult customers and live on a budget. ((For example)), a graduate who has worked in a shop already knows how to speak to strangers politely and deal with complaints."},
  {label:"Conclusion",text:"((In conclusion)), [[I believe that]] a short period of work before university benefits most young adults. ((Although)) it delays graduation slightly, the gain in maturity and in the quality of their choices is, [[in my view]], far more valuable."}],
 why:[
  "The introduction names both views, gives the opinion, and says what the essay will do.",
  "Body 2 reports the opposite view fairly, then answers it with \"However, I am convinced that…\".",
  "Each body paragraph develops one idea with an explanation and an example.",
  "The conclusion accepts one small cost and then confirms the writer's view."]},
{id:"q4",topic:"Health",
 q:"Some people think that every school should make one hour of sport compulsory each day. To what extent do you agree or disagree?",
 keywords:["sport","exercise","school","schools","students","health","daily","hour","physical"],
 plan:{pos:"Agree with one condition",
  i1:"Daily exercise protects young people from a sedentary lifestyle.",
  e1:"Teenagers who sit all day gain weight and sleep badly.",
  i2:"Exercise improves mood, concentration and results in class.",
  e2:"A short session before study helps students focus.",
  con:"Make it compulsory, but let students choose the activity."},
 paras:[
  {label:"Introduction",text:"Some people believe that schools should concentrate on academic subjects, ((while)) others argue that an hour of physical activity should be compulsory every day. [[In my view]], daily sport should be part of every school day, ((provided that)) students are allowed to choose the type of exercise. This essay will examine both views and give the reasons for my opinion."},
  {label:"Body 1: why daily sport is needed",text:"((Firstly)), young people today spend most of their time sitting, ((either)) in class ((or)) in front of a screen. ((As a result)), a sedentary lifestyle has become normal, ((which leads to)) weight gain, poor sleep and long-term health problems. ((For example)), doctors in many countries report rising rates of diabetes among teenagers. ((Therefore)), an hour of daily exercise at school would reach every child, ((including)) those whose families cannot afford a sports club. ((Furthermore)), habits formed at school tend to last: a teenager who enjoys daily exercise is far more likely to stay active as an adult."},
  {label:"Body 2: the opposite view, and my answer to it",text:"((On the other hand)), some people argue that an hour of sport every day takes valuable time away from academic subjects, ((particularly)) in examination years. ((They also claim that)) exercise is the responsibility of families rather than schools. [[However, I am convinced that]] these objections are weak. Physical activity reduces stress and raises energy levels, ((so)) students return to class far more able to concentrate; ((in other words)), they learn more in four focused lessons than in five lessons they are too tired to follow. ((Moreover)), many families have neither the time nor the money for sports clubs, ((so)) school is the only place where every child can exercise safely."},
  {label:"Conclusion",text:"((In conclusion)), [[I strongly support]] making daily sport compulsory in schools, ((because)) it protects students' health and helps them study more effectively. ((Nevertheless)), schools should offer a range of activities, ((so that)) every student finds one they enjoy."}],
 why:[
  "Both views appear in the introduction, followed by an opinion with one clear condition.",
  "Body 2 states the objection in the other side's own words before answering it.",
  "Examples and topic collocations (a sedentary lifestyle, academic performance) support both paragraphs.",
  "The conclusion returns to the condition given in the introduction."]},
{id:"q5",topic:"City life",
 q:"Some people believe that private cars should be banned from city centres. To what extent do you agree or disagree?",
 keywords:["cars","car","city","centre","centres","traffic","transport","pollution","drivers"],
 plan:{pos:"Partly agree",
  i1:"Fewer cars means cleaner air and safer, quieter streets.",
  e1:"Cities with car-free centres report lower pollution levels.",
  i2:"A ban is unfair unless public transport is good enough first.",
  e2:"Elderly people and families with young children need door-to-door travel.",
  con:"Restrict cars gradually, after investing in public transport."},
 paras:[
  {label:"Introduction",text:"Some people believe that city centres would be far healthier without private vehicles, ((while)) others argue that such a ban would be unfair to residents. [[In my opinion]], cars should eventually be restricted, ((but)) only ((once)) public transport is genuinely reliable. In this essay I will discuss both views and give reasons for my position."},
  {label:"Body 1: the view that cars should be banned",text:"((Firstly)), removing cars from the centre would improve air quality. Traffic is responsible for a large share of carbon emissions in urban areas, ((so)) fewer vehicles would mean cleaner air and fewer breathing problems. ((In addition)), pedestrian streets are safer and more pleasant, ((which)) encourages people to walk and to spend time in shops and cafés. ((For example)), several European cities have reported both lower pollution and higher sales after closing their centres to traffic. ((Moreover)), delivery vehicles and taxis could still be permitted, ((so)) shops in the centre would not lose their supplies."},
  {label:"Body 2: the other view, and my position",text:"((On the other hand)), some residents argue that a ban would create serious difficulties for them. Elderly people, families with small children and workers who carry equipment cannot easily use a bus, ((particularly)) in a hot climate. ((Furthermore)), if the metro is crowded and the buses are slow, a ban simply punishes people who have no alternative. ((For example)), a nurse finishing a night shift at two in the morning cannot rely on a bus that runs once an hour. [[In my view]], governments should ((therefore)) [[first]] invest in frequent, air-conditioned public transport and ((only then)) restrict private vehicles."},
  {label:"Conclusion",text:"((In conclusion)), [[I agree that]] city centres would be healthier without private cars, ((but)) [[I do not believe]] such a ban should be introduced immediately. ((Instead)), cities should improve public transport first and reduce traffic step by step."}],
 why:[
  "The introduction gives both views, the writer's opinion and the plan of the essay.",
  "Body 1 argues for the ban; Body 2 gives the other side and the writer's condition.",
  "Specific examples and topic collocations (carbon emissions, public transport) raise the vocabulary score.",
  "The conclusion gives a practical order of steps instead of repeating the same words."]}
];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mk=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<mark class="pos">$1</mark>').replace(/\(\((.+?)\)\)/g,'<span class="lk">$1</span>');
const plain=s=>String(s).replace(/\[\[|\]\]|\(\(|\)\)/g,"");
const TOTAL=40*60;
const STEPS=[["brief","Exam brief","التعليمات","📋"],["question","Question","السؤال","❓"],["plan","Plan","التخطيط","🗺️"],["write","Write","الكتابة","✍️"],["check","Check","المراجعة","🔍"],["model","Model answer","الإجابة النموذجية","📄"],["result","Result","النتيجة","🏁"]];
const LINKERS=["firstly","secondly","finally","in addition","moreover","furthermore","however","on the other hand","nevertheless","whereas","while","although","because","since","due to","as a result","therefore","consequently","which leads to","so that","for example","for instance","such as","in other words","this means that","in my view","in my opinion","in conclusion","to sum up","overall","on balance","in contrast","despite","even though","also","so","first of all","another reason","for this reason","that is why","besides","apart from","at the same time","not only","by contrast","instead"];
const POS=/(i (strongly |completely |totally |largely |partly |firmly )?(agree|disagree|believe|think|feel|support|oppose)|in my (view|opinion)|i am convinced|from my point of view|i do not believe|this essay will argue)/i;
const CONC=/\b(in conclusion|to conclude|to sum up|in summary|overall|on balance)\b/i;
const EXAMPLE=/\b(for example|for instance|such as|to illustrate)\b/i;
const OTHERS=/\b(some people|many people|some argue|some believe|others|it is (often|sometimes) (said|argued|claimed|suggested)|opponents|critics|supporters)\b/i;
const CONTRAST=/\b(while|whereas|however|on the other hand|although|but|in contrast)\b/i;
const OTHERVIEW=/(on the other hand|others (believe|argue|think|say|point out)|some people (believe|argue|think|say|point out)|it could be argued|opponents|critics|those who (oppose|support)|they (point out|also claim|argue))/i;
const CONTRACT=/\b(don't|doesn't|didn't|can't|won't|isn't|aren't|it's|i'm|they're|we're|shouldn't|couldn't|wouldn't|hasn't|haven't)\b/i;
const INFORMAL=[["a lot of","a large number of / a great deal of"],["kids","children / young people"],["stuff","items / materials"],["big problem","serious problem"],["nowadays everybody","in recent years, many people"],["and so on","and similar examples"],["i wanna","I would like to"],["gonna","going to"]];
const STOP=new Set("the a an and or but of to in on for with that this these those is are was were be been being it its as at by from they them their there here we you i he she his her our your not no do does did have has had will would can could should may might more most some any all very also than then so such which who what when where how about into over under between during because if while although however therefore".split(" "));
/* ---------- state ---------- */
function fresh(){return{v:1,qid:null,started:false,elapsed:0,running:false,timeUp:false,untimed:false,extra:0,plan:{va:"",vb:"",pos:"",i1:"",e1:"",i2:"",e2:"",con:""},text:"",submitted:false,self:{},step:"brief",done:{},finishedAt:null};}
let S=fresh(),cur="brief",tick=null,hist=[];
const KEY="t2-exam-agree-v1",HKEY="t2-exam-agree-history";
function Q(){return QS.find(q=>q.id===S.qid);}
function limit(){return TOTAL+S.extra;}
function left(){return Math.max(0,limit()-S.elapsed);}
const mmss=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");
/* ---------- analysis ---------- */
function paras(t){return t.split(/\n\s*\n|\n/).map(x=>x.trim()).filter(x=>x.split(/\s+/).length>4);}
function words(t){t=t.trim();return t?t.split(/\s+/).length:0;}
function sentences(t){return t.split(/[.!?]+/).map(x=>x.trim()).filter(x=>x.split(/\s+/).length>2);}
function foundLinkers(t){const l=t.toLowerCase();return LINKERS.filter(x=>new RegExp("(^|[^a-z])"+x.replace(/\s+/g,"\\s+")+"(?![a-z])","i").test(l));}
function topWord(t,skip){const S2=new Set((skip||[]).map(x=>x.toLowerCase()));const c={};t.toLowerCase().replace(/[^a-z\s']/g," ").split(/\s+/).forEach(w=>{if(w.length>3&&!STOP.has(w)&&!S2.has(w))c[w]=(c[w]||0)+1;});
  let b=["",0];Object.keys(c).forEach(w=>{if(c[w]>b[1])b=[w,c[w]];});return b;}
function analyse(){
  const t=S.text,P=paras(t),n=words(t),S2=sentences(t),lk=foundLinkers(t),q=Q();
  const first=P[0]||"",last=P[P.length-1]||"";
  const longest=S2.reduce((m,s)=>Math.max(m,words(s)),0);
  const avg=S2.length?Math.round(n/S2.length):0;
  const kw=q?q.keywords.filter(k=>new RegExp("\\b"+k+"\\b","i").test(t)).length:0;
  const inf=INFORMAL.filter(p=>new RegExp("\\b"+p[0].replace(/\s+/g,"\\s+")+"\\b","i").test(t));
  const rep=topWord(t,q?q.keywords:[]);
  const C=[];
  const add=(st,title,note)=>C.push({st,title,note});
  add(n>=250?"pass":"fail","Length: "+n+" words",n>=250?"You are above the 250-word minimum.":"Under 250 words loses marks automatically. Aim for 260 to 280.");
  add(P.length>=4?"pass":P.length===3?"warnc":"fail","Paragraphs: "+P.length,P.length>=4?"Introduction, two body paragraphs and a conclusion.":"Task 2 needs four clear paragraphs. Leave an empty line between them.");
  add(POS.test(first)?"pass":"fail","Position in the introduction",POS.test(first)?"Your opinion is clear from the start.":"The examiner must see your position in the introduction. Use 'I completely agree that…', 'In my view…' or 'I partly agree…'.");
  add(CONC.test(last)&&POS.test(last)?"pass":CONC.test(last)?"warnc":"fail","Position in the conclusion",CONC.test(last)&&POS.test(last)?"Your conclusion signals the ending and repeats your position.":CONC.test(last)?"Your conclusion starts well, but it does not repeat your opinion.":"End with 'In conclusion,' and your position in new words.");
  add(OTHERS.test(first)&&CONTRAST.test(first)?"pass":"fail","Both views in the introduction",OTHERS.test(first)&&CONTRAST.test(first)?"You gave the two sides before your own opinion.":"Open with both sides: 'Some people believe that…, while others argue that…'. Then give your opinion.");
  const bodies=P.slice(1,-1), twoSides=OTHERVIEW.test(bodies.join(" "))||bodies.some(x=>/^however\b/i.test(x));
  add(twoSides?"pass":"fail","Both sides in the body",twoSides?"One body paragraph presents the other side.":"One body paragraph must explain the view you do not hold: 'On the other hand, some people argue that…'. Then answer it.");
  add(lk.length>=6?"pass":lk.length>=4?"warnc":"fail","Linking words: "+lk.length+" different","Found: "+(lk.slice(0,12).join(", ")||"none")+". Aim for six or more, spread across the essay.");
  add(EXAMPLE.test(t)?"pass":"fail","Examples",EXAMPLE.test(t)?"You introduced at least one example. Check that every main idea has one.":"Support each main idea with 'For example,' or 'such as'. Examples raise your Task Response score.");
  add(kw>=3?"pass":"warnc","Topic vocabulary: "+kw+" key words",kw>=3?"You stayed on the topic of the question.":"Your answer drifts from the question. Use its key ideas, in your own words.");
  add(!CONTRACT.test(t)?"pass":"warnc","Academic register",!CONTRACT.test(t)?"No contractions found.":"Contractions such as don't and it's are too informal. Write do not, it is.");
  add(inf.length===0?"pass":"warnc","Informal words",inf.length?inf.map(p=>p[0]+" → "+p[1]).join("; "):"No informal expressions found.");
  add(longest<=40?"pass":"warnc","Longest sentence: "+longest+" words",longest<=40?"Sentence length looks controlled. Average: "+avg+" words.":"Very long sentences lose marks for grammar. Split anything over 40 words.");
  add(rep[1]<=6?"pass":"warnc","Repeated word: "+(rep[0]||"none")+(rep[1]?" ("+rep[1]+"×)":""),rep[1]<=6?"Good variety of vocabulary. Words from the question itself are not counted here.":"Find synonyms for '"+rep[0]+"' so the examiner sees a wider range.");
  const pass=C.filter(c=>c.st==="pass").length;
  return {C,pass,total:C.length,n,P,lk,S2,avg,longest};
}
const SELF=[["Task response",["I answered the exact question and kept one clear position.","I explained both sides, not only the side I agree with.","I wrote two developed main ideas, each with an example."]],
 ["Coherence and cohesion",["My essay has four paragraphs and each one has a single main idea.","I used linking words correctly, without repeating the same one."]],
 ["Lexical resource",["I used topic vocabulary and did not repeat the same words.","I paraphrased the question instead of copying it."]],
 ["Grammar",["I used a mix of short and longer sentences.","I checked my verb endings, articles and plurals."]]];
const SELFN=SELF.reduce((n,x)=>n+x[1].length,0);
function selfCount(){return Object.values(S.self).filter(Boolean).length;}
function bandGuess(a){
  const auto=a.pass/a.total, self=selfCount()/SELFN, mix=(auto*0.7+self*0.3);
  if(a.n<250) return ["Under 250 words","A short answer is capped, whatever its quality. Write the full essay, then check again."];
  if(selfCount()===0) return [a.pass+" of "+a.total+" automatic checks passed","Now tick the statements below. Your estimate appears as soon as you mark yourself."];
  if(mix>=0.9) return ["Band 6.5 to 7 shape","Your essay has everything the examiner looks for. Accuracy of grammar and vocabulary decides the rest."];
  if(mix>=0.75) return ["Around Band 6","A solid exam answer. Fix the red and orange points below to push higher."];
  if(mix>=0.55) return ["Band 5.5 to 6","The main parts are there, but some are weak. Work through the failed checks."];
  return ["Band 5 or below","Rebuild the essay around a clear position, four paragraphs and examples."];
}
/* ---------- chrome ---------- */
function stepOK(id){
  if(id==="question"||id==="brief")return true;
  if(!S.qid)return false;
  if(id==="model"||id==="result")return S.submitted;
  return true;
}
function renderRail(){
  $("#rail").innerHTML=STEPS.map(([id,en,ar],i)=>`<button class="rs ${id===cur?"on":""} ${S.done[id]?"ok":""}" data-act="go" data-s="${id}" ${stepOK(id)?"":"disabled"}><span class="n">${S.done[id]?"✓":i+1}</span><span class="t">${en}<small>${ar}</small></span></button>`).join("");
}
function renderClock(){
  const c=$("#clock"),b=$("#pausebtn");
  if(S.untimed){c.textContent="No timer";c.className="clock off";b.hidden=true;return;}
  const l=left();
  c.textContent=mmss(l);
  c.className="clock"+(!S.started?" off":l<=300?" bad":l<=600?" warn":"");
  b.hidden=!S.started||S.timeUp;b.textContent=S.running?"Pause":"Resume";
  $("#wpill").textContent=words(S.text)+" words";
}
function startClock(){
  if(tick)clearInterval(tick);
  tick=setInterval(()=>{
    if(!S.running||S.untimed||S.timeUp)return;
    S.elapsed++;
    if(left()<=0){S.timeUp=true;S.running=false;toast("Time is up. Stop writing and go to Check.");if(cur==="write")render();}
    if(left()===600||left()===300)toast(mmss(left()).slice(0,2).replace(/^0/,"")+" minutes left.");
    renderClock();saveLocal();
  },1000);
}
function go(id){
  if(!stepOK(id))return;
  if(id==="write"&&S.started&&!S.timeUp)S.running=true;
  cur=id;S.step=id;S.done[id]=true;render();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
function render(){
  renderRail();renderClock();
  const f={brief:pBrief,question:pQuestion,plan:pPlan,write:pWrite,check:pCheck,model:pModel,result:pResult}[cur];
  $("#main").innerHTML=f()+nav();
  if(cur==="write"){const t=$("#essay");if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}updWrite();}
  saveLocal();
}
function nav(){
  const i=STEPS.findIndex(s=>s[0]===cur);
  const prev=i>0?`<button class="btn ghost" data-act="go" data-s="${STEPS[i-1][0]}">Back</button>`:"<span></span>";
  const nx=STEPS[i+1];
  const next=nx&&stepOK(nx[0])?`<button class="btn" data-act="go" data-s="${nx[0]}">Next: ${nx[1]}</button>`:"";
  return `<div class="navrow">${prev}${next}</div>`;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="go")return go(b.dataset.s);
  if(a==="pause"){if(S.timeUp)return;S.running=!S.running;renderClock();toast(S.running?"Timer running.":"Timer paused.");return;}
  if(a==="rand"){const pool=QS.filter(q=>q.id!==S.qid);const q=pool[Math.floor(Math.random()*pool.length)];pick(q.id);return;}
  if(a==="pick")return pick(b.dataset.q);
  if(a==="start"){if(!S.started){S.started=true;S.running=!S.untimed;startClock();}else if(!S.timeUp&&!S.untimed)S.running=true;go("plan");return;}
  if(a==="extra"){S.extra+=300;S.timeUp=false;S.running=!S.untimed;render();toast("Five extra minutes added. The real exam does not do this.");return;}
  if(a==="submit"){
    if(words(S.text)<60&&!confirm("You have written very little. Hand it in anyway?"))return;
    S.submitted=true;S.running=false;S.finishedAt=new Date().toLocaleString("en-GB");
    const a2=analyse();
    hist.push({date:new Date().toLocaleDateString("en-GB"),topic:Q().topic,n:a2.n,time:mmss(S.elapsed),pass:a2.pass,total:a2.total});
    try{localStorage.setItem(HKEY,JSON.stringify(hist.slice(-20)));}catch(err){}
    go("check");return;
  }
  if(a==="download")return download();
  if(a==="save")return saveFile();
  if(a==="load")return $("#file").click();
  if(a==="print"){window.print();return;}
  if(a==="again"){if(!confirm("Start a new attempt? Your current answer will be cleared. Download it first if you want to keep it."))return;
    const u=S.untimed;S=fresh();S.untimed=u;cur="question";if(tick)clearInterval(tick);render();toast("New attempt ready.");return;}
});
function pick(id){
  if(S.text.trim()&&S.qid!==id&&!confirm("Change the question? Your current answer will be cleared."))return;
  if(S.qid!==id){const u=S.untimed;S=fresh();S.untimed=u;S.qid=id;}
  render();
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="essay"){S.text=t.value;updWrite();saveLocal();return;}
  if(t.dataset.p){S.plan[t.dataset.p]=t.value;saveLocal();return;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.p){S.plan[t.dataset.p]=t.value;saveLocal();return;}
  if(t.dataset.self!==undefined){S.self[t.dataset.self]=t.checked;const n=$("#selfn");if(n)n.textContent=selfCount();
    const bt=$("#bandt");if(bt){const g=bandGuess(analyse());bt.textContent=g[0];$("#bandn").textContent=g[1];}saveLocal();return;}
  if(t.dataset.act==="untimed"){S.untimed=t.checked;if(S.untimed)S.running=false;else if(S.started&&!S.timeUp)S.running=true;renderClock();saveLocal();return;}
});
window.addEventListener("beforeunload",e=>{if(S.text.trim()&&!S.submitted){e.preventDefault();e.returnValue="";}});
/* ---------- files ---------- */
function dl(name,text,type){
  const b=new Blob([text],{type:type||"text/plain;charset=utf-8"});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function download(){
  const q=Q(),a=analyse(),p=S.plan;
  const lines=["IELTS Writing Task 2 — exam practice (agree or disagree)","Date: "+(S.finishedAt||new Date().toLocaleString("en-GB")),"",
   "QUESTION","-".repeat(60),q.q,"","MY PLAN","-".repeat(60),
   "View A: "+(p.va||"—"),"View B: "+(p.vb||"—"),"Position: "+(p.pos||"—"),"Body 1: "+(p.i1||"—"),"Example 1: "+(p.e1||"—"),"Body 2: "+(p.i2||"—"),"Example 2: "+(p.e2||"—"),"Conclusion: "+(p.con||"—"),"",
   "MY ANSWER ("+a.n+" words, "+mmss(S.elapsed)+" used)","-".repeat(60),S.text,"",
   "AUTOMATIC CHECK ("+a.pass+"/"+a.total+")","-".repeat(60)].concat(a.C.map(c=>(c.st==="pass"?"[ok]  ":c.st==="fail"?"[fix] ":"[!]   ")+c.title+" — "+c.note));
  dl("Task2-agree-disagree-"+(S.qid||"answer")+".txt",lines.join("\n"));
  toast("Answer downloaded. Send the file to your teacher if she asks for it.");
}
function saveFile(){dl("Task2-exam-agree-progress.json",JSON.stringify(S,null,1),"application/json");toast("Progress saved to your downloads.");}
$("#file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!("qid" in o))throw 0;S=Object.assign(fresh(),o);cur=S.step||"brief";if(S.started&&!S.timeUp&&!S.untimed){S.running=false;startClock();}render();toast("Progress loaded. The timer is paused.");}
  catch(err){alert("This file could not be read. Choose a progress file saved from this app.");}};
  r.readAsText(f);e.target.value="";
});
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function loadLocal(){
  try{const h=localStorage.getItem(HKEY);if(h)hist=JSON.parse(h)||[];}catch(e){}
  try{const s=localStorage.getItem(KEY);if(!s)return false;const o=JSON.parse(s);if(!o||!o.qid&&!o.text)return false;
    S=Object.assign(fresh(),o);S.running=false;cur=S.step||"brief";if(S.started&&!S.timeUp)startClock();return true;}catch(e){return false;}
}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3200);}
/* ---------- start ---------- */
if(loadLocal()){render();setTimeout(()=>toast("Your last attempt was restored. The timer is paused."),400);}else render();
</script></body></html>
